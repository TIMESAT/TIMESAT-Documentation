name: Documentation Pages (manual, deployment disabled by default)

# No push, release or pull-request trigger. Creating this file publishes nothing.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the validated site to GitHub Pages (requires separate approval)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-website.txt
      - name: Install website dependencies
        run: python -m pip install --requirement requirements-website.txt
      - name: Build and validate
        run: |
          python -m mkdocs build --strict
          python scripts/check_site.py
      - name: Upload Pages artifact only when deployment was explicitly requested
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: ${{ inputs.deploy && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
