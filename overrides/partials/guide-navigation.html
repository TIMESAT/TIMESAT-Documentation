<nav class="timesat-guide-nav" aria-label="Guide shortcuts">
  <div class="timesat-guide-nav__inner md-grid">
    <a href="{{ 'user-guide/table-of-contents/' | url }}" class="timesat-guide-nav__link" aria-label="Table of contents">Contents</a>
    <a href="https://github.com/TIMESAT" class="timesat-guide-nav__link">TIMESAT GitHub <span aria-hidden="true">↗</span></a>
    <div class="timesat-guide-nav__pages">
      {% if page and page.previous_page %}
        <a href="{{ page.previous_page.url | url }}" class="timesat-guide-nav__link" rel="prev" title="Previous: {{ page.previous_page.title | e }}" aria-label="Previous: {{ page.previous_page.title | e }}">
          <span aria-hidden="true">←</span><span class="timesat-guide-nav__label">Previous</span>
        </a>
      {% endif %}
      {% if page and page.next_page %}
        <a href="{{ page.next_page.url | url }}" class="timesat-guide-nav__link" rel="next" title="Next: {{ page.next_page.title | e }}" aria-label="Next: {{ page.next_page.title | e }}">
          <span class="timesat-guide-nav__label">Next</span><span aria-hidden="true">→</span>
        </a>
      {% endif %}
    </div>
  </div>
</nav>
